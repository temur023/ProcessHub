
# API платформы на отдельном порту (install.sh --api-port). Сама служба слушает только
# 127.0.0.1:8000; наружу её выводит nginx — с теми же заголовками, что и /api/ сайта.
server {
    listen @API_PORT@;
    server_name _;
    absolute_redirect off;

    client_max_body_size 64m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Сохраняем также порт публичного адреса для проверки Origin в API.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
