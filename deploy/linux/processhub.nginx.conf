# Process Hub на одном адресе: страницы — из сборки, /api — в API платформы,
# /drawio/ — локальная копия редактора draw.io. Тот же порядок, что в app/nginx.conf
# (Docker), только файлы и службы — на этом сервере. Файл создаёт install.sh
# из шаблона: порт и HTTPS подставляются по параметрам --port и --tls-*.
server {
    listen @LISTEN@ default_server;
    server_name _;
@TLS@
    # Порт и адрес в перенаправлениях — как у браузера: сервер может быть
    # опубликован через NAT на другом адресе и порту.
    absolute_redirect off;

    # ES-модули PDF.js используют .mjs; базовая таблица nginx не содержит это
    # расширение. Сохраняем остальные MIME-типы.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Импорт draw.io — до 30 МБ, страница холста на расчёт линий — до 64 МБ.
    client_max_body_size 64m;

    # Большие карты считаются и выгружаются долго (импорт «Харид» — минуты).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Сохраняем также порт публичного адреса для проверки Origin в API.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответы API уже сжаты бэкендом; тело запроса (gzip-страница холста)
        # уходит как есть.
        proxy_request_buffering off;
    }

    # Редактор draw.io — на том же адресе, что и платформа: встроенный редактор
    # открывается фреймом и говорит с ней сообщениями.
    location = /drawio {
        return 301 /drawio/;
    }

    location /drawio/ {
        alias /opt/processhub/drawio/;
    }

    root /opt/processhub/web;

    # Сборка Vite кладёт файлы с хэшем в имени — их можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Адреса приложения (/process/…, /catalog/…) — это одна страница.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # Скрипт draw.io — 10 МБ без сжатия.
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml;
}
