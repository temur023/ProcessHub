# Фронтенд и API на одном адресе: страницы — из сборки, /api — в сервис api.
server {
    listen 80;
    server_name _;

    # ES-модули PDF.js используют .mjs; базовая таблица nginx 1.27
    # не содержит это расширение. Сохраняем остальные MIME-типы.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Импорт draw.io — до 30 МБ, страница холста на расчёт линий — до 64 МБ.
    client_max_body_size 64m;

    # Большие карты считаются и выгружаются долго (импорт «Харид» — минуты).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Адрес api ищется через DNS Docker при запросе, а не один раз при старте:
    # пересозданный контейнер API получает новый IP, и nginx со старым
    # отвечал бы 502, пока его не перезапустят.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # Сохраняем также порт публичного адреса для проверки Origin в API.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ответы API уже сжаты бэкендом; тело запроса (gzip-страница холста)
        # уходит как есть.
        proxy_request_buffering off;
    }

    # Редактор draw.io (сервис drawio) — на том же адресе, что и платформа:
    # встроенный редактор открывается фреймом и говорит с ней сообщениями.
    set $drawio http://drawio:8080;

    location = /drawio {
        return 301 /drawio/;
    }

    location /drawio/ {
        rewrite ^/drawio/(.*)$ /$1 break;
        proxy_pass $drawio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    root /usr/share/nginx/html;

    # Сборка Vite кладёт файлы с хэшем в имени — их можно кэшировать навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Адреса приложения (/process/…, /catalog/…) — это одна страница.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    # И то, что пришло через прокси: скрипт draw.io — 10 МБ без сжатия.
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json application/xml;
}
